<!DOCTYPE html>
<html lang="uk">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Ring-2Zero</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #statusbar {
    padding: 0 16px;
    background: #111;
    border-bottom: 1px solid #222;
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: #666;
    flex-shrink: 0;
    height: 36px;
    align-items: center;
  }
  #statusbar span { color: #e0e0e0; }
  #status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #333; display: inline-block; margin-right: 6px;
    transition: background 0.3s;
  }
  #status-dot.connected { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
  #status-dot.connecting { background: #fbbf24; }
  #status-dot.error     { background: #f87171; }
  #btn-mode {
    margin-left: auto; padding: 2px 10px;
    background: #222; border: 1px solid #444; color: #e0e0e0;
    font-family: 'Courier New', monospace; font-size: 11px;
    cursor: pointer; border-radius: 3px; user-select: none;
  }
  #btn-mode:hover, #btn-control:hover { background: #333; }
  #btn-control {
    padding: 2px 10px;
    background: #222; border: 1px solid #444; color: #e0e0e0;
    font-family: 'Courier New', monospace; font-size: 11px;
    cursor: pointer; border-radius: 3px; user-select: none;
  }
  #btn-control[hidden] { display: none; }
  #btn-control.on { background: #7c2d12; border-color: #c2410c; }
  #display-canvas.control { cursor: crosshair; touch-action: none; }

  #viewport {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    position: relative;
  }
  #viewport.scroll { overflow: auto; }

  #display-canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
    background: #000;
  }

  #overlay {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center; color: #444; pointer-events: none; z-index: 10;
  }
  #overlay p { font-size: 14px; margin-top: 8px; }

  #password-overlay {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: #0a0a0a;
    z-index: 20;
  }
  #password-form {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    width: 240px;
  }
  #password-form h1 {
    font-size: 20px; letter-spacing: 1px; margin-bottom: 8px; color: #e0e0e0;
  }
  #password-row {
    display: flex; width: 100%; gap: 8px;
  }
  #password-input {
    flex: 1; min-width: 0; padding: 10px 12px;
    background: #1a1a1a; border: 1px solid #333; border-radius: 6px;
    color: #e0e0e0; font-family: inherit; font-size: 14px;
  }
  #password-input:focus { outline: none; border-color: #666; }
  #password-toggle {
    flex-shrink: 0; padding: 10px 12px;
    background: #1a1a1a; border: 1px solid #333; border-radius: 6px;
    cursor: pointer; font-size: 14px;
  }
  #password-form button[type="submit"] {
    width: 100%; padding: 10px 12px;
    background: #2a2a2a; border: 1px solid #444; border-radius: 6px;
    color: #e0e0e0; font-family: inherit; font-size: 14px; cursor: pointer;
  }
  #password-form button[type="submit"]:hover { background: #333; }
  #password-toggle:hover { background: #333; }
  #password-error {
    display: none;
    color: #e05555; font-size: 13px;
  }
</style>
</head>
<body>

<div id="statusbar">
  <div><span id="status-dot"></span><span id="status-text">Підключення...</span></div>
  <div>Тайлів/с: <span id="tiles">—</span></div>
  <div>Трафік: <span id="frame-size">—</span></div>
  <div>Латентність: <span id="latency">—</span></div>
  <div>Розмір: <span id="info">—</span></div>
  <div>Debug: <span id="debug-info">—</span></div>
  <button id="btn-mode">FIT</button>
  <button id="btn-control" hidden title="Керувати мишею й клавіатурою віддаленої машини">КЕРУВАННЯ: ВИМК</button>
</div>

<div id="viewport">
  <canvas id="display-canvas"></canvas>
  <div id="overlay"><p>Очікування підключення через WebRTC...<br><small id="server-label">Server: ws://localhost:9001</small></p></div>
  <div id="password-overlay">
    <form id="password-form">
      <h1>Ring-2Zero</h1>
      <div id="password-row">
        <input id="password-input" type="password" placeholder="Пароль" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus>
        <button type="button" id="password-toggle">👁</button>
      </div>
      <button type="submit">Увійти</button>
      <p id="password-error">Невірний пароль</p>
    </form>
  </div>
</div>

<script>
  const viewport    = document.getElementById('viewport');
  const dispCanvas  = document.getElementById('display-canvas');
  const dispCtx     = dispCanvas.getContext('2d', {
    alpha: false,
    desynchronized: true
  });
  const overlay     = document.getElementById('overlay');
  const statusDot   = document.getElementById('status-dot');
  const statusText  = document.getElementById('status-text');
  const tilesEl     = document.getElementById('tiles');
  const frameSizeEl = document.getElementById('frame-size');
  const latencyEl   = document.getElementById('latency');
  const infoEl      = document.getElementById('info');
  const btnMode     = document.getElementById('btn-mode');
  const btnControl  = document.getElementById('btn-control');
  const passwordOverlay = document.getElementById('password-overlay');
  const passwordForm    = document.getElementById('password-form');
  const passwordInput   = document.getElementById('password-input');
  const passwordError   = document.getElementById('password-error');
  const passwordToggle  = document.getElementById('password-toggle');
  passwordToggle.addEventListener('click', () => {
    passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
  });

  let mode    = 'fit';
  let screenW = 0;
  let screenH = 0;

  let offscreen = null;
  let offCtx    = null;
  let dst = { x: 0, y: 0, w: 0, h: 0 };

  const pending = [];
  let rafId = null;

  function scheduleRaf() {
    if (!rafId) rafId = requestAnimationFrame(renderFrame);
  }

  function renderFrame() {
    rafId = null;
    if (!offscreen) return;

    for (const { bitmap, x, y, w, h } of pending) {
      offCtx.drawImage(bitmap, x, y, w, h);
      bitmap.close();
    }
    pending.length = 0;

    if (mode === 'fit') {
      dispCtx.clearRect(0, 0, dispCanvas.width, dispCanvas.height);
    }
    dispCtx.drawImage(offscreen, dst.x, dst.y, dst.w, dst.h);
  }

  function applyMode() {
    if (!screenW) return;
    const dpr  = window.devicePixelRatio || 1;
    const rect = viewport.getBoundingClientRect();
    const vw   = rect.width;
    const vh   = rect.height;
    if (!vw || !vh) return;

    if (mode === 'fit') {
      viewport.classList.remove('scroll');
      btnMode.textContent = 'FIT';
      const scale = Math.min(vw / screenW, vh / screenH);
      const dw = Math.round(screenW * scale);
      const dh = Math.round(screenH * scale);
      dst = {
        x: Math.round((vw - dw) / 2) * dpr,
        y: Math.round((vh - dh) / 2) * dpr,
        w: dw * dpr,
        h: dh * dpr
      };
      dispCanvas.width        = Math.round(vw * dpr);
      dispCanvas.height       = Math.round(vh * dpr);
      dispCanvas.style.width  = vw + 'px';
      dispCanvas.style.height = vh + 'px';
    } else {
      viewport.classList.add('scroll');
      btnMode.textContent = '1:1';
      dst = { x: 0, y: 0, w: screenW, h: screenH };
      dispCanvas.width        = screenW;
      dispCanvas.height       = screenH;
      dispCanvas.style.width  = screenW + 'px';
      dispCanvas.style.height = screenH + 'px';
    }
    if (offscreen) scheduleRaf();
  }

  function initFrame(w, h) {
    screenW = w;
    screenH = h;
    offscreen = new OffscreenCanvas(w, h);
    offCtx    = offscreen.getContext('2d', { alpha: false });
    infoEl.textContent = w + 'x' + h;
    requestAnimationFrame(applyMode);
  }

  btnMode.addEventListener('click', () => {
    mode = mode === 'fit' ? 'scroll' : 'fit';
    applyMode();
  });

  window.addEventListener('resize', () => {
    requestAnimationFrame(() => { if (mode === 'fit') applyMode(); });
  });

  // Stringifies an error/rejection value for display: prefer `.message` when
  // present, otherwise fall back to a safe String() conversion (handles
  // non-Error rejections, e.g. a bare DOMException without .message).
  function errMsg(e) {
    return e && e.message ? e.message : String(e);
  }

  // Статистика
  let tileCount     = 0;
  let totalBytes    = 0;
  let lastStatTime  = 0;
  let latencySum    = 0;
  let latencyCount  = 0;

  function resetStats() {
    tileCount      = 0;
    totalBytes     = 0;
    lastStatTime   = Date.now();
    latencySum     = 0;
    latencyCount   = 0;
    decodeOkCount   = 0;
    decodeFailCount = 0;
    msgCount        = 0;
    ackMsgCount     = 0;
    tileMsgCount    = 0;
  }

  // WebRTC з мінімальною латентністю
  let pc = null;
  let dataChannel = null;
  let ws = null;
  let currentSession = null; // echoed back to the server so it can tell a
                              // stale (abandoned) negotiation attempt apart
                              // from the current one after a reconnect
  let ackPending = null; // { seq, remaining } for the tile batch currently being decoded
  let decodeOkCount = 0;
  let decodeFailCount = 0;
  let msgCount = 0;
  let ackMsgCount = 0;
  let tileMsgCount = 0;

  const debugInfoEl = document.getElementById('debug-info');
  setInterval(() => {
    debugInfoEl.textContent =
      `msgs=${msgCount} ack=${ackMsgCount} tileMsgs=${tileMsgCount} ` +
      `decoded=${decodeOkCount} failed=${decodeFailCount} pending=${pending.length} ` +
      `screen=${screenW}x${screenH} canvas=${dispCanvas.width}x${dispCanvas.height}`;
  }, 1000);

  function maybeAck(entry) {
    if (!entry) return;
    entry.remaining -= 1;
    if (entry.remaining <= 0 && dataChannel && dataChannel.readyState === 'open') {
      const ack = new ArrayBuffer(4);
      new DataView(ack).setUint32(0, entry.seq, true);
      dataChannel.send(ack);
    }
  }

  // Server address override: open this page as client.html?server=100.x.x.x:9001
  // to connect to a different host than the one it was loaded from — e.g.
  // when this file is opened directly (file://, no location.host at all) or
  // hosted on a separate static server from the WebSocket backend. When the
  // ring-2zero server serves this page itself (the normal case — it's
  // embedded in the binary), location.host is already exactly the right
  // host:port, whether that's localhost or a Tailscale hostname, so no query
  // param is needed at all.
  const pageParams = new URLSearchParams(location.search);
  const wsHost = pageParams.get('server') || location.host || 'localhost:9001';
  // Match the page's own scheme: a page loaded over https must use wss (Safari
  // blocks ws:// as mixed content from a secure page, and requires https for
  // WebRTC to work at all).
  const wsScheme = location.protocol === 'https:' ? 'wss' : 'ws';
  document.getElementById('server-label').textContent = `Server: ${wsScheme}://${wsHost}`;

  const TOKEN_STORAGE_KEY = 'ring2zero_token';

  // The token is sent as the first WebSocket message, never in the URL,
  // where it would end up in history and proxy logs.
  const wsUrl = `${wsScheme}://${wsHost}`;
  const CLOSE_UNAUTHORIZED = 4001; // see src/auth.rs

  // Password gate: ask once, remember on this device (localStorage) so the
  // bookmarked link doesn't need the token pasted into the URL bar (visible
  // in history/autocomplete) every time.
  function promptForToken(showError) {
    return new Promise((resolve) => {
      passwordOverlay.style.display = 'flex';
      passwordError.style.display = showError ? 'block' : 'none';
      passwordInput.value = '';
      passwordInput.focus();
      passwordForm.onsubmit = (e) => {
        e.preventDefault();
        const value = passwordInput.value;
        if (!value) return;
        passwordOverlay.style.display = 'none';
        resolve(value);
      };
    });
  }

  let lastAuthFailed = false;
  let serverHello = null; // {version, ice_servers, control} — sent by the server after auth

  async function connect() {
    resetStats();

    let token = localStorage.getItem(TOKEN_STORAGE_KEY);
    if (!token) {
      token = await promptForToken(lastAuthFailed);
      lastAuthFailed = false;
    }

    statusDot.className = 'connecting';
    statusText.textContent = `Підключення до ${wsScheme}://${wsHost}...`;

    try {
      console.log('Connecting to:', wsUrl);
      ws = new WebSocket(wsUrl);
      let authenticated = false;

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'auth', token }));
        statusText.textContent = 'Перевірка пароля...';
      };

      ws.onmessage = async (event) => {
        try {
          const message = JSON.parse(event.data);

          if (message.type === 'hello') {
            authenticated = true;
            serverHello = message;
            localStorage.setItem(TOKEN_STORAGE_KEY, token);
            btnControl.hidden = !message.control;
            console.log(`Authenticated, server v${message.version}, waiting for offer...`);
            statusText.textContent = 'Пароль прийнято, чекаємо offer...';
          } else if (message.type === 'offer') {
            console.log('Received offer from server');
            statusText.textContent = 'Отримано offer, створюємо з\'єднання...';
            currentSession = message.session;

            // Close stale connection on reconnect
            if (pc) {
              pc.close();
              pc = null;
              dataChannel = null;
            }

            pc = new RTCPeerConnection({
              iceServers: (serverHello && serverHello.ice_servers) || []
            });

            pc.oniceconnectionstatechange = () => {
              console.log('ICE connection state:', pc.iceConnectionState);
            };

            pc.onconnectionstatechange = () => {
              console.log('Connection state:', pc.connectionState);
            };

            pc.onicecandidate = (event) => {
              if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                  type: 'candidate',
                  candidate: event.candidate.toJSON(),
                  session: currentSession
                }));
              }
            };

            pc.ondatachannel = (event) => {
              console.log('DataChannel received from server:', event.channel.label);
              if (event.channel.label === 'input') {
                attachInputChannel(event.channel);
                return;
              }
              dataChannel = event.channel;
              dataChannel.binaryType = 'arraybuffer';

              dataChannel.onopen = () => {
                statusDot.className    = 'connected';
                statusText.textContent = 'Підключено';
                overlay.style.display  = 'none';
                console.log('DataChannel opened');
              };

              dataChannel.onmessage = (event) => {
                msgCount++;
                const receiveTime = performance.now();
                const data = event.data;
                const view = new DataView(data);
                const marker = view.getUint16(0, true);

                // Resolution header
                if (marker === 0xFFFF) {
                  const w = view.getUint16(2, true);
                  const h = view.getUint16(4, true);
                  initFrame(w, h);
                  return;
                }

                // Sequence control packet — marks the start of a tile batch.
                // The ACK is withheld until every tile in the batch has been
                // successfully decoded (see maybeAck below), not sent here on
                // marker receipt alone.
                if (marker === 0xFFFE) {
                  ackMsgCount++;
                  const seq = view.getUint32(2, true);
                  const tileCount = view.getUint32(6, true);
                  ackPending = { seq, remaining: tileCount };
                  return;
                }

                tileMsgCount++;
                let offset = 0;
                const now = Date.now();

                while (offset < data.byteLength) {
                  const tileLen = view.getUint32(offset, true);
                  offset += 4;

                  const tileData = data.slice(offset, offset + tileLen);
                  const tileView = new DataView(tileData);
                  const x = tileView.getUint16(0, true);
                  const y = tileView.getUint16(2, true);
                  const w = tileView.getUint16(4, true);
                  const h = tileView.getUint16(6, true);

                  const ackEntry = ackPending;
                  createImageBitmap(new Blob([tileData.slice(8)], { type: 'image/webp' }))
                    .then(bitmap => {
                      pending.push({ bitmap, x, y, w, h });
                      scheduleRaf();
                      decodeOkCount++;

                      const decodeTime = performance.now() - receiveTime;
                      latencySum += decodeTime;
                      latencyCount++;
                      maybeAck(ackEntry);
                    })
                    .catch(e => {
                      decodeFailCount++;
                      console.error('WebP decode failed:', e);
                      statusText.textContent = `Decode fail ${decodeFailCount}/${decodeFailCount + decodeOkCount}: ${errMsg(e)}`;
                    });
                    // Deliberately not ack'd on decode failure: withholding the
                    // ACK lets the server's ack_timeout classify this tile as
                    // stale and resend it.

                  tileCount++;
                  totalBytes += tileLen;
                  offset += tileLen;
                }

                if (now - lastStatTime >= 1000) {
                  tilesEl.textContent    = tileCount;
                  frameSizeEl.textContent = (totalBytes * 8 / 1000).toFixed(0) + ' кбіт/с';
                  latencyEl.textContent  = latencyCount
                    ? (latencySum / latencyCount).toFixed(1) + ' мс'
                    : '—';

                  tileCount     = 0;
                  totalBytes    = 0;
                  latencySum    = 0;
                  latencyCount  = 0;
                  lastStatTime  = now;
                }
              };

              dataChannel.onclose = () => {
                console.log('DataChannel closed, waiting for reconnect...');
                statusDot.className = 'connecting';
                statusText.textContent = 'Перепідключення...';
                dataChannel = null;
              };

              dataChannel.onerror = (err) => {
                console.error('DataChannel error:', err);
              };
            };

            await pc.setRemoteDescription({
              type: 'offer',
              sdp: message.sdp
            });

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            if (pc.iceGatheringState !== 'complete') {
              await Promise.race([
                new Promise((resolve) => {
                  const checkState = () => {
                    console.log('ICE gathering state:', pc.iceGatheringState);
                    if (pc.iceGatheringState === 'complete') {
                      pc.removeEventListener('icegatheringstatechange', checkState);
                      resolve();
                    }
                  };
                  pc.addEventListener('icegatheringstatechange', checkState);
                }),
                new Promise(resolve => setTimeout(resolve, 3000))
              ]);
            }

            console.log('Sending answer to server');

            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({
                type: 'answer',
                sdp: pc.localDescription.sdp,
                session: currentSession
              }));
            }
          } else if (message.type === 'candidate' && pc) {
            if (message.candidate) {
              try {
                await pc.addIceCandidate(new RTCIceCandidate(message.candidate));
              } catch (e) {
                console.error('Error adding ICE candidate:', e);
              }
            }
          }
        } catch (err) {
          console.error('Message handling error:', err);
          statusText.textContent = 'Помилка: ' + errMsg(err);
        }
      };

      ws.onerror = (err) => {
        console.error('WebSocket error:', err);
        statusDot.className = 'error';
        statusText.textContent = 'Помилка WebSocket';
      };

      ws.onclose = (event) => {
        console.log('WebSocket closed', event.code);
        statusDot.className = 'error';
        inputCapture.disable();
        if (event.code === CLOSE_UNAUTHORIZED) {
          // The server explicitly rejected the token — the only case where
          // it's actually wrong. Anything else (network blip, restart) keeps
          // the saved token and just retries.
          localStorage.removeItem(TOKEN_STORAGE_KEY);
          lastAuthFailed = true;
          statusText.textContent = 'Невірний пароль';
          setTimeout(connect, 300);
        } else {
          statusText.textContent = authenticated
            ? 'З\'єднання закрито, перепідключення...'
            : 'Сервер недоступний, повторна спроба...';
          setTimeout(connect, authenticated ? 1000 : 2000);
        }
      };

    } catch (err) {
      console.error('Connection failed:', err);
      statusDot.className = 'error';
      statusText.textContent = 'Не вдалося підключитися: ' + errMsg(err);
    }
  }

  // --- Remote control -----------------------------------------------------
  // The server only opens an "input" channel when started with --control.
  let inputChannel = null;
  const inputCapture = createInputCapture({
    canvas: dispCanvas,
    getGeometry: () => (screenW ? { dst, dpr: mode === 'fit' ? (window.devicePixelRatio || 1) : 1 } : null),
    send: (buf) => {
      if (inputChannel && inputChannel.readyState === 'open') inputChannel.send(buf);
    },
  });

  function setControl(on) {
    if (on) inputCapture.enable(); else inputCapture.disable();
    btnControl.classList.toggle('on', on);
    btnControl.textContent = on ? 'КЕРУВАННЯ: УВІМК' : 'КЕРУВАННЯ: ВИМК';
    dispCanvas.classList.toggle('control', on);
  }

  function attachInputChannel(channel) {
    inputChannel = channel;
    channel.binaryType = 'arraybuffer';
    channel.onclose = () => { setControl(false); inputChannel = null; };
  }

  btnControl.addEventListener('click', () => {
    setControl(!inputCapture.isEnabled());
    btnControl.blur(); // so Space/Enter go to the remote, not re-toggle this button
  });

// Captures mouse/keyboard over the canvas and sends them as input-channel
  // events (wire format: src/protocol.rs). Keys go by physical position
  // (KeyboardEvent.code → Linux evdev code), so the host's layout decides
  // what gets typed. Everything held is released on disable, blur and tab
  // hide — otherwise a key held while focus leaves stays stuck on the host.
  function createInputCapture({ canvas, getGeometry, send }) {
    const KEYMAP = {
      Escape: 1, Digit1: 2, Digit2: 3, Digit3: 4, Digit4: 5, Digit5: 6, Digit6: 7, Digit7: 8, Digit8: 9, Digit9: 10, Digit0: 11,
      Minus: 12, Equal: 13, Backspace: 14, Tab: 15,
      KeyQ: 16, KeyW: 17, KeyE: 18, KeyR: 19, KeyT: 20, KeyY: 21, KeyU: 22, KeyI: 23, KeyO: 24, KeyP: 25,
      BracketLeft: 26, BracketRight: 27, Enter: 28, ControlLeft: 29,
      KeyA: 30, KeyS: 31, KeyD: 32, KeyF: 33, KeyG: 34, KeyH: 35, KeyJ: 36, KeyK: 37, KeyL: 38,
      Semicolon: 39, Quote: 40, Backquote: 41, ShiftLeft: 42, Backslash: 43,
      KeyZ: 44, KeyX: 45, KeyC: 46, KeyV: 47, KeyB: 48, KeyN: 49, KeyM: 50,
      Comma: 51, Period: 52, Slash: 53, ShiftRight: 54, NumpadMultiply: 55, AltLeft: 56, Space: 57, CapsLock: 58,
      F1: 59, F2: 60, F3: 61, F4: 62, F5: 63, F6: 64, F7: 65, F8: 66, F9: 67, F10: 68,
      NumLock: 69, ScrollLock: 70, Numpad7: 71, Numpad8: 72, Numpad9: 73, NumpadSubtract: 74,
      Numpad4: 75, Numpad5: 76, Numpad6: 77, NumpadAdd: 78, Numpad1: 79, Numpad2: 80, Numpad3: 81,
      Numpad0: 82, NumpadDecimal: 83, IntlBackslash: 86, F11: 87, F12: 88,
      NumpadEnter: 96, ControlRight: 97, NumpadDivide: 98, PrintScreen: 99, AltRight: 100,
      Home: 102, ArrowUp: 103, PageUp: 104, ArrowLeft: 105, ArrowRight: 106, End: 107, ArrowDown: 108,
      PageDown: 109, Insert: 110, Delete: 111, Pause: 119, MetaLeft: 125, MetaRight: 126, ContextMenu: 127,
    };

    let enabled = false;
    let pendingMotion = null; // latest [x, y], flushed once per animation frame
    let rafId = 0;
    const heldKeys = new Set();
    const heldButtons = new Set();

    function msg(type, fill, len) {
      const buf = new ArrayBuffer(len);
      const v = new DataView(buf);
      v.setUint8(0, type);
      fill(v);
      return buf;
    }
    const clampI16 = (n) => Math.max(-32768, Math.min(32767, Math.round(n)));

    function sendMotionNow(x, y) {
      send(msg(0x01, (v) => { v.setUint16(1, x, true); v.setUint16(3, y, true); }, 5));
    }
    function flushMotion() {
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      if (pendingMotion) { sendMotionNow(...pendingMotion); pendingMotion = null; }
    }
    function sendButton(button, pressed) {
      send(msg(0x02, (v) => { v.setUint8(1, button); v.setUint8(2, pressed ? 1 : 0); }, 3));
    }
    function sendKey(code, pressed) {
      send(msg(0x04, (v) => { v.setUint16(1, code, true); v.setUint8(3, pressed ? 1 : 0); }, 4));
    }

    // Canvas-local pointer position → normalised 0..65535 over the drawn
    // remote screen (dst is in backing-store pixels), clamped to its edges.
    function normalise(e) {
      const g = getGeometry();
      if (!g || !g.dst.w || !g.dst.h) return null;
      const f = (off, start, size) => Math.round(Math.max(0, Math.min(1, (off * g.dpr - start) / size)) * 65535);
      return [f(e.offsetX, g.dst.x, g.dst.w), f(e.offsetY, g.dst.y, g.dst.h)];
    }

    function onPointerMove(e) {
      const pos = normalise(e);
      if (!pos) return;
      pendingMotion = pos;
      if (!rafId) rafId = requestAnimationFrame(() => { rafId = 0; flushMotion(); });
    }
    function onPointerDown(e) {
      canvas.setPointerCapture(e.pointerId); // drags that leave the canvas still get their mouseup
    }
    // mousedown/mouseup rather than pointer events for buttons: a second
    // button pressed while another is held fires no pointerdown, only a
    // pointermove, but it does fire mousedown.
    function onMouseButton(e) {
      if (e.button > 4) return;
      const pressed = e.type === 'mousedown';
      if (e.button >= 3) e.preventDefault(); // back/forward would navigate away
      if (pressed === heldButtons.has(e.button)) return;
      const pos = normalise(e);
      if (pos) { pendingMotion = pos; }
      flushMotion(); // the click must land where the pointer is
      if (pressed) heldButtons.add(e.button); else heldButtons.delete(e.button);
      sendButton(e.button, pressed);
    }
    function onWheel(e) {
      e.preventDefault();
      const scale = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 800 : 1;
      const dx = clampI16(e.deltaX * scale), dy = clampI16(e.deltaY * scale);
      if (!dx && !dy) return;
      flushMotion();
      send(msg(0x03, (v) => { v.setInt16(1, dx, true); v.setInt16(3, dy, true); }, 5));
    }
    function onKey(e) {
      const code = KEYMAP[e.code];
      if (code === undefined) return;
      e.preventDefault();
      const pressed = e.type === 'keydown';
      if (e.repeat || pressed === heldKeys.has(code)) return; // the host does its own key repeat
      if (pressed) heldKeys.add(code); else heldKeys.delete(code);
      sendKey(code, pressed);
    }
    const suppress = (e) => e.preventDefault();
    function onVisibility() { if (document.visibilityState === 'hidden') releaseAll(); }

    const listeners = [
      [canvas, 'pointermove', onPointerMove],
      [canvas, 'pointerdown', onPointerDown],
      [canvas, 'mousedown', onMouseButton],
      [canvas, 'mouseup', onMouseButton],
      [canvas, 'auxclick', suppress],
      [canvas, 'contextmenu', suppress],
      [canvas, 'wheel', onWheel, { passive: false }],
      [window, 'keydown', onKey],
      [window, 'keyup', onKey],
      [window, 'blur', releaseAll],
      [document, 'visibilitychange', onVisibility],
    ];

    function releaseAll() {
      flushMotion();
      for (const code of heldKeys) sendKey(code, false);
      for (const b of heldButtons) sendButton(b, false);
      heldKeys.clear();
      heldButtons.clear();
    }
    function enable() {
      if (enabled) return;
      enabled = true;
      for (const [t, ev, fn, o] of listeners) t.addEventListener(ev, fn, o);
    }
    function disable() {
      if (!enabled) return;
      releaseAll();
      for (const [t, ev, fn, o] of listeners) t.removeEventListener(ev, fn, o);
      enabled = false;
    }
    return { enable, disable, releaseAll, isEnabled: () => enabled };
  }

  connect();
</script>
</body>
</html>
